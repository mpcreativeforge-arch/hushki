name: Nasazení na hushki.cz (Webglobe)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: webglobe
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: if [ -n "$FTP_SERVER" ]; then echo "ok=true"; else echo "ok=false"; fi >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.check.outputs.ok == 'true'
        run: npm ci && npm run build
        env:
          BASE_PATH: /
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      - if: steps.check.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # složka webu na FTP (u Webglobe obvykle www/)
          server-dir: ${{ vars.FTP_DIR || './' }}
